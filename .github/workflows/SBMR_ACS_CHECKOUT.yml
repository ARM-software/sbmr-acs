name: SBMR ACS Build Checker

on:
  push:
    branches:                # trigger on push to main
      - main
  pull_request:              # trigger on pull requests to main
    branches:
      - main
  workflow_dispatch:         # to dispatch from Github Actions

jobs:
  checkout_and_package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip -r requirements.txt
        python -m pip install "robotframework>=6.1"

    - name: Validate Robot Framework
      run: |
        robot --dryrun \
          --argumentfile config \
          --variable BMC_ID:bmc \
          --variable SYSTEM_ID:system \
          --variable CHASSIS_ID:chassis \
          --outputdir logs/dry-run \
          --name "SBMR-ACS dry-run" \
          .

    - name: Zip the repository
      if: always()
      run: |
        COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        # store the commit_sha in Actions environment variable
        echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_ENV"

        zip -r sbmr-acs-$COMMIT_SHA.zip .
        ls sbmr-acs-$COMMIT_SHA.zip

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sbmr-acs-${{ env.commit_sha }}.zip
        path: sbmr-acs-${{ env.commit_sha }}.zip
