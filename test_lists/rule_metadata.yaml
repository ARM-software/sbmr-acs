    - M21_IPMI2_Send_Boot_Progress_Code_2_Command
    - M21_IPMI2_Get_Boot_Progress_2_Code
    - M21_PCI_1_Interface_Availability
    - M21_PCI_1_Redfish_Graphical_Console_Capability
    - M21_USB_1_Redfish_Virtual_Media_Action_Uri
    - M1_JTAG_1_JTAG_Remote_Debug_Declaration
    - M1_JTAG_2_ADI_TAP_Access_Declaration
    - M2_JTAG_2_JTAG_Debug_Capability_Declaration
    - M3_JTAG_2_Production_JTAG_Disable_Declaration
